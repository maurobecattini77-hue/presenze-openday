<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a3b22">
<meta name="robots" content="noindex, nofollow">
<title>Presenze Open Day</title>
<style>
:root{
  --fondo:#f6f1ea; --carta:#ffffff; --inchiostro:#2b2420; --tenue:#6f655d; --linea:#e4dbd0;
  --cotto:#7a3b22; --cotto-chiaro:#f3e6dd;
  --verde:#2e7a4c; --verde-chiaro:#e3f2e8; --arancio:#b8620b; --arancio-chiaro:#fdf0e1; --rosso:#a3312a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--inchiostro);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.alto{position:sticky;top:0;z-index:5}
.testa{background:var(--cotto);color:#fff;padding:10px 16px 12px;
  padding-top:calc(10px + env(safe-area-inset-top))}
.riga-titolo{display:flex;align-items:center;gap:10px}
.titolo{flex:1;font-size:17px;font-weight:600;line-height:1.2}
.pulsante-qr{border:0;border-radius:10px;background:#fff;color:var(--cotto);padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.stato{margin-top:8px;display:flex;align-items:flex-start;gap:8px;background:#fff;color:var(--inchiostro);
  border-radius:10px;padding:8px 10px;font-size:14px}
.stato .pallino{flex:none;width:12px;height:12px;border-radius:50%;margin-top:3px;background:var(--tenue)}
.stato.ok .pallino{background:var(--verde)}
.stato.attesa .pallino{background:var(--arancio)}
.stato.male .pallino{background:var(--rosso)}
.barra{background:var(--fondo);padding:10px 16px 8px;border-bottom:1px solid var(--linea)}
.turni{display:flex;gap:8px}
.turno{flex:1;border:1px solid var(--linea);background:var(--carta);border-radius:10px;padding:8px 6px;text-align:center}
.turno .n{display:block;font-weight:600}
.turno .c{display:block;font-size:13px;color:var(--tenue)}
.turno.scelto{border-color:var(--cotto);box-shadow:inset 0 0 0 1px var(--cotto)}
.turno.scelto .n{color:var(--cotto)}
.conta{margin:8px 2px 6px;font-size:15px}
.conta b{font-weight:600}
.cerca{width:100%;border:1px solid var(--linea);border-radius:10px;padding:10px 12px;background:var(--carta);font-size:16px}
.cerca:focus{outline:2px solid var(--cotto);outline-offset:0}
main{padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
ul.lista{list-style:none;margin:0;padding:0}
.fam{display:flex;align-items:center;gap:12px;background:var(--carta);border:1px solid var(--linea);border-radius:12px;
  padding:10px 12px;margin:0 0 8px;min-height:62px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.fam .casella{flex:none;width:34px;height:34px;border-radius:8px;border:2px solid #b9ada1;background:#fff;display:flex;align-items:center;justify-content:center}
.fam .casella svg{width:22px;height:22px;visibility:hidden}
.fam.presente{background:var(--verde-chiaro);border-color:#b7dcc4}
.fam.presente .casella{background:var(--verde);border-color:var(--verde)}
.fam.presente .casella svg{visibility:visible}
.fam .testo{flex:1;min-width:0}
.fam .alunno{display:block;font-weight:500;font-size:17px;overflow-wrap:anywhere}
.fam .genitore{display:block;color:var(--tenue);font-size:14px;overflow-wrap:anywhere}
.fam .segni{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.etichetta{font-size:12px;border-radius:6px;padding:2px 6px;background:var(--cotto-chiaro);color:var(--cotto)}
.etichetta.invio{background:var(--arancio-chiaro);color:var(--arancio)}
.togli{border:1px solid var(--linea);background:#fff;border-radius:8px;font-size:13px;padding:4px 8px;color:var(--rosso)}
.vuoto{color:var(--tenue);text-align:center;padding:18px 8px}
.grande{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;margin-top:10px}
.aggiungi{background:var(--cotto);color:#fff}
.secondario{background:var(--carta);color:var(--cotto);border:1px solid var(--linea)}
.totale{margin-top:14px;color:var(--tenue);font-size:14px;text-align:center}
.velo{position:fixed;inset:0;z-index:20;background:rgba(30,22,18,.55);display:none;align-items:flex-end;justify-content:center}
.velo.aperto{display:flex}
.foglio{background:var(--carta);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.foglio h2{margin:0 0 8px;font-size:19px;font-weight:600}
.foglio p{margin:0 0 12px;color:var(--tenue)}
.foglio label{display:block;font-size:14px;color:var(--tenue);margin:10px 0 4px}
.foglio input[type=text],.foglio input[type=tel],.foglio input[type=email]{width:100%;border:1px solid var(--linea);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
.scelte{display:flex;gap:8px}
.scelte label{flex:1;margin:0;border:1px solid var(--linea);border-radius:10px;padding:10px;text-align:center;color:var(--inchiostro)}
.scelte input{margin-right:6px}
.errore{color:var(--rosso);font-size:14px;min-height:18px;margin-top:6px}
.qr{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px;margin:6px auto 12px;max-width:340px}
.qr svg{display:block;width:100%;height:auto}
.schermo{padding:40px 20px;text-align:center}
.schermo h1{font-size:21px;font-weight:600;margin:0 0 10px}
.schermo p{color:var(--tenue);margin:0 0 16px}
</style>
</head>
<body>
<div id="app"></div>

function ora(t){ var d = new Date(t); return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }

/* --- chi sono e quale Open Day: dall'indirizzo (QR) o dal telefono --- */
function confDaIndirizzo(){
  // la chiave può arrivare dopo «?» (link mandati per messaggio) o dopo «#» (link vecchi)
  var p = {};
  [location.search.replace(/^\?/, ''), location.hash.replace(/^#/, '')].forEach(function(h){
    h.split('&').forEach(function(x){ var i = x.indexOf('='); if (i > 0) p[x.slice(0, i)] = decodeURIComponent(x.slice(i + 1)); });
  });
  return (p.e && p.k) ? {e: p.e, k: p.k} : null;
}
var conf = confDaIndirizzo();
if (conf) scrivi('od_conf', conf); else conf = leggi('od_conf');

var disp = leggi('od_disp'); if (!disp) { disp = casuale(8); scrivi('od_disp', disp); }
var CHIAVE_STATO = conf ? 'od_stato_' + conf.e : null;
var st = conf ? (leggi(CHIAVE_STATO) || {famiglie: null, coda: [], agg: null}) : null;
var tab = leggi('od_tab') || '09';
var filtro = '';
var inVolo = false, timer = null, esito = 'inizio', paginaPronta = false;

function salva(){ if (CHIAVE_STATO && !scrivi(CHIAVE_STATO, st)) esito = 'memoria'; }

/* --- pagina salvata sul telefono per quando non c'è rete --- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){ return caches.open('presenze-v1'); })
    .then(function(c){ return c.match('./index.html'); })
    .then(function(r){ paginaPronta = !!r; disegnaStato(); })
    .catch(function(){ paginaPronta = false; disegnaStato(); });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

/* --- l'elenco visto da questo telefono: quello del cloud più i segni non ancora inviati --- */
function vista(){
  var mappa = {}, ordine = [];
  (st.famiglie || []).forEach(function(f){ mappa[f.id] = {id: f.id, turno: f.turno, alunno: f.alunno, genitore: f.genitore,
    aggiunta: f.aggiunta, presente: f.presente, attesa: false}; ordine.push(f.id); });
  st.coda.forEach(function(m){
    if (m.tipo === 'nuova' && !mappa[m.id]) { mappa[m.id] = {id: m.id, turno: m.turno, alunno: m.alunno, genitore: m.genitore,
      aggiunta: true, presente: m.presente, attesa: true}; ordine.push(m.id); }
    else if (m.tipo === 'segno' && mappa[m.id]) { mappa[m.id].presente = m.presente; mappa[m.id].attesa = true; }
    else if (m.tipo === 'togli' && mappa[m.id]) { mappa[m.id].via = true; }
  });
  return ordine.map(function(id){ return mappa[id]; }).filter(function(f){ return !f.via; })
    .sort(function(a, b){ return a.alunno.localeCompare(b.alunno, 'it', {sensitivity: 'base'}); });
}
function turni(){ return st.turni || [{id: '09', nome: 'Ore 9', spiega: 'con laboratorio'}, {id: '11', nome: 'Ore 11', spiega: 'senza laboratorio'}]; }

/* --- disegno --- */
var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function schermo(titolo, testo, bottone){
  app.innerHTML = '<div class="schermo"><h1>' + esc(titolo) + '</h1><p>' + testo + '</p>' +
    (bottone ? '<button class="grande aggiungi" id="riprova">' + esc(bottone) + '</button>' : '') + '</div>';
  var b = document.getElementById('riprova'); if (b) b.onclick = function(){ location.reload(); };
}

function struttura(){
  app.innerHTML =
    '<div class="alto"><header class="testa" id="testa"><div class="riga-titolo"><div class="titolo" id="titolo"></div>' +
    '<button class="pulsante-qr" id="apri-qr">QR per un compagno</button></div>' +
    '<div class="stato" id="stato"><span class="pallino"></span><span id="stato-testo"></span></div></header>' +
    '<div class="barra" id="barra"><div class="turni" id="turni"></div><div class="conta" id="conta"></div>' +
    '<input class="cerca" id="cerca" type="search" placeholder="Cerca un cognome" autocomplete="off" autocorrect="off" spellcheck="false"></div></div>' +
    '<main><ul class="lista" id="lista"></ul><div class="vuoto" id="vuoto" hidden></div>' +
    '<button class="grande aggiungi" id="apri-aggiungi">Aggiungi una famiglia non prenotata</button>' +
    '<div class="totale" id="totale"></div></main>' +
    '<div class="velo" id="velo-qr"><div class="foglio"><h2>Fai entrare un compagno</h2>' +
    '<p>Il compagno inquadra questo codice con la fotocamera del telefono e gli si apre lo stesso elenco. Fatelo dove il telefono prende.</p>' +
    '<div class="qr" id="qr"></div><button class="grande secondario" id="chiudi-qr">Chiudi</button></div></div>' +
    '<div class="velo" id="velo-agg"><div class="foglio"><h2>Famiglia non prenotata</h2>' +
    '<label for="a-alunno">Alunno/a: cognome e nome</label><input type="text" id="a-alunno" autocapitalize="words" autocomplete="off">' +
    '<label for="a-gen">Genitore: cognome e nome</label><input type="text" id="a-gen" autocapitalize="words" autocomplete="off">' +
    '<label for="a-tel">Telefono del genitore (se lo lascia)</label><input type="tel" id="a-tel" autocomplete="off">' +
    '<label for="a-mail">Mail del genitore (se la lascia)</label><input type="email" id="a-mail" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">' +
    '<label>Turno</label><div class="scelte" id="a-turni"></div><div class="errore" id="a-err"></div>' +
    '<button class="grande aggiungi" id="a-salva">Salva: è presente</button><button class="grande secondario" id="a-annulla">Annulla</button></div></div>';
  document.getElementById('cerca').addEventListener('input', function(e){ filtro = e.target.value; disegnaLista(); });
  document.getElementById('apri-qr').onclick = apriQr;
  document.getElementById('chiudi-qr').onclick = function(){ document.getElementById('velo-qr').classList.remove('aperto'); };
  document.getElementById('apri-aggiungi').onclick = apriAggiungi;
  document.getElementById('a-annulla').onclick = function(){ document.getElementById('velo-agg').classList.remove('aperto'); };
  document.getElementById('a-salva').onclick = salvaAggiunta;
  document.getElementById('lista').addEventListener('click', clicLista);
}

function disegnaStato(){
  var el = document.getElementById('stato'); if (!el) return;
  var t = document.getElementById('stato-testo');
  var n = st.coda.length, cls = '', msg = '';
  if (esito === 'memoria') { cls = 'male'; msg = 'Il telefono non riesce a salvare: non chiudere questa pagina.'; }
  else if (n > 0) {
    cls = 'attesa';
    msg = (n === 1 ? '1 segno salvato sul telefono' : n + ' segni salvati sul telefono') + ', da inviare: partono da soli appena c\'è rete.';
  } else if (esito === 'ok') {
    cls = 'ok';
    msg = (paginaPronta ? 'Pronto anche senza rete. ' : 'Non chiudere questa pagina. ') + 'Tutto inviato, aggiornato alle ' + ora(st.agg) + '.';
  } else if (esito === 'rete') {
    cls = st.agg ? '' : 'male';
    msg = 'Senza rete: i segni restano sul telefono.' + (st.agg ? ' Elenco aggiornato alle ' + ora(st.agg) + '.' : '');
  } else { msg = 'Collegamento in corso...'; }
  el.className = 'stato ' + cls; t.textContent = msg;
}

function disegnaLista(){
  var tutte = vista(), lista = document.getElementById('lista'); if (!lista) return;
  var tt = turni();
  if (!tt.some(function(x){ return x.id === tab; })) tab = tt[0].id;
  document.getElementById('titolo').textContent = st.titolo || 'Open Day';
  document.getElementById('turni').innerHTML = tt.map(function(x){
    var del = tutte.filter(function(f){ return f.turno === x.id && !f.aggiunta; });
    var pres = del.filter(function(f){ return f.presente; }).length;
    var nAgg = tutte.filter(function(f){ return f.turno === x.id && f.aggiunta; }).length;
    return '<button class="turno' + (x.id === tab ? ' scelto' : '') + '" data-t="' + esc(x.id) + '"><span class="n">' + esc(x.nome) +
      '</span><span class="c">' + esc(x.spiega) + '</span><span class="c">' + pres + ' presenti su ' + del.length + '</span>' +
      (nAgg ? '<span class="c">più ' + nAgg + (nAgg === 1 ? ' aggiunta' : ' aggiunte') + '</span>' : '') + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.turno'), function(b){
    b.onclick = function(){ tab = b.getAttribute('data-t'); scrivi('od_tab', tab); disegnaLista(); window.scrollTo(0, 0); };
  });
  var qui = tutte.filter(function(f){ return f.turno === tab; });
  var pren = qui.filter(function(f){ return !f.aggiunta; }), agg = qui.filter(function(f){ return f.aggiunta; });
  var presPren = pren.filter(function(f){ return f.presente; }).length;
  document.getElementById('conta').innerHTML = 'Presenti <b>' + presPren + '</b> su ' + pren.length + ' prenotate' +
    (agg.length ? ', più <b>' + agg.length + '</b> ' + (agg.length === 1 ? 'aggiunta' : 'aggiunte') : '');
  var parole = piano(filtro).split(/\s+/).filter(Boolean);
  var vis = qui.filter(function(f){ var s = piano(f.alunno + ' ' + f.genitore); return parole.every(function(p){ return s.indexOf(p) >= 0; }); });
  lista.innerHTML = vis.map(function(f){
    return '<li class="fam' + (f.presente ? ' presente' : '') + '" data-id="' + esc(f.id) + '" role="checkbox" aria-checked="' + f.presente + '">' +
      '<span class="casella">' + TICK + '</span><span class="testo"><span class="alunno">' + esc(f.alunno) + '</span>' +
      (f.genitore ? '<span class="genitore">' + esc(f.genitore) + '</span>' : '') + '</span>' +
      ((f.aggiunta || f.attesa) ? '<span class="segni">' + (f.aggiunta ? '<span class="etichetta">aggiunta</span>' : '') +
        (f.attesa ? '<span class="etichetta invio">da inviare</span>' : '') +
        (f.aggiunta ? '<button class="togli" data-togli="' + esc(f.id) + '">Elimina</button>' : '') + '</span>' : '') + '</li>';
  }).join('');
  var vuoto = document.getElementById('vuoto');
  vuoto.hidden = vis.length > 0;
  vuoto.textContent = qui.length ? 'Nessuna famiglia con questo nome: se non è prenotata, aggiungila qui sotto.' : 'Nessuna famiglia prenotata in questo turno.';
  var tot = tutte.filter(function(f){ return !f.aggiunta; }), totAgg = tutte.filter(function(f){ return f.aggiunta; }).length;
  document.getElementById('totale').textContent = tt.length > 1 ? 'In tutto: ' + tot.filter(function(f){ return f.presente; }).length +
    ' presenti su ' + tot.length + ' prenotate' + (totAgg ? ', più ' + totAgg + (totAgg === 1 ? ' aggiunta' : ' aggiunte') : '') + '.' : '';
  disegnaStato();
}

/* --- segni --- */
function metti(m){ m.mid = casuale(10); m.quando = new Date().toISOString(); m.disp = disp; st.coda.push(m); salva(); disegnaLista(); presto(); }

function clicLista(e){
  var tb = e.target.closest('[data-togli]');
  var li = e.target.closest('.fam'); if (!li) return;
  var id = li.getAttribute('data-id');
  var f = vista().filter(function(x){ return x.id === id; })[0]; if (!f) return;
  if (tb) {
    if (confirm('Eliminare dall\'elenco ' + f.alunno + '? Serve solo se è stata aggiunta per sbaglio.')) metti({tipo: 'togli', id: id});
    return;
  }
  metti({tipo: 'segno', id: id, presente: !f.presente});
}

function apriAggiungi(){
  document.getElementById('a-alunno').value = '';
  document.getElementById('a-gen').value = '';
  document.getElementById('a-tel').value = '';
  document.getElementById('a-mail').value = '';
  document.getElementById('a-err').textContent = '';
  document.getElementById('a-turni').innerHTML = turni().map(function(x){
    return '<label><input type="radio" name="a-turno" value="' + esc(x.id) + '"' + (x.id === tab ? ' checked' : '') + '>' + esc(x.nome) + '</label>';
  }).join('');
  document.getElementById('velo-agg').classList.add('aperto');
  setTimeout(function(){ document.getElementById('a-alunno').focus(); }, 50);
}
function pulito(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }
function bello(s){
  return pulito(s).split(' ').map(function(w){
    if (w !== w.toLowerCase() && w !== w.toUpperCase()) return w;
    return w.toLowerCase().replace(/(^|['\-])(\S)/g, function(m, a, b){ return a + b.toUpperCase(); });
  }).join(' ');
}
function salvaAggiunta(){
  var a = bello(document.getElementById('a-alunno').value), g = bello(document.getElementById('a-gen').value),
      t = pulito(document.getElementById('a-tel').value), ml = pulito(document.getElementById('a-mail').value).replace(/\s/g, '').toLowerCase();
  var tr = document.querySelector('input[name=a-turno]:checked');
  if (!a) { document.getElementById('a-err').textContent = 'Scrivi almeno cognome e nome dell\'alunno/a.'; return; }
  var turno = tr ? tr.value : tab;
  metti({tipo: 'nuova', id: 'a' + casuale(12), turno: turno, alunno: a.slice(0, 80), genitore: g.slice(0, 80), telefono: t.slice(0, 30), mail: ml.slice(0, 120), presente: true});
  document.getElementById('velo-agg').classList.remove('aperto');
  tab = turno; scrivi('od_tab', tab); filtro = ''; document.getElementById('cerca').value = ''; disegnaLista();
}

function apriQr(){
  var url = location.origin + location.pathname + '?e=' + encodeURIComponent(conf.e) + '&k=' + encodeURIComponent(conf.k);
  try { var q = qrcode(0, 'M'); q.addData(url); q.make();
    document.getElementById('qr').innerHTML = q.createSvgTag({cellSize: 6, margin: 3, scalable: true});
  } catch(e) { document.getElementById('qr').textContent = 'Non riesco a disegnare il codice.'; }
  document.getElementById('velo-qr').classList.add('aperto');
}

/* --- invio al cloud --- */
function presto(){ clearTimeout(timer); timer = setTimeout(sincronizza, 200); }
function programma(){ clearTimeout(timer); timer = setTimeout(sincronizza, st.coda.length ? 4000 : 15000); }

function finito(){
  togliChiave(CHIAVE_STATO); togliChiave('od_conf'); togliChiave('od_tab');
  if (location.hash || location.search) history.replaceState(null, '', location.pathname);
  clearTimeout(timer); timer = null; st = null;
  schermo('L\'Open Day è finito', 'L\'elenco è stato cancellato da questo telefono. Grazie per l\'aiuto!');
}

function sincronizza(){
  if (!st) return;
  if (st.scade && Date.now() > Date.parse(st.scade)) { finito(); return; }
  if (inVolo) return; inVolo = true;
  var invio = st.coda.slice(0, 200), inviati = {};
  invio.forEach(function(m){ inviati[m.mid] = 1; });
  var ctl = window.AbortController ? new AbortController() : null;
  var tempo = setTimeout(function(){ if (ctl) ctl.abort(); }, 12000);
  fetch(CLOUD, {method: 'POST', cache: 'no-store', signal: ctl ? ctl.signal : undefined,
    headers: {'apikey': PUB, 'Content-Type': 'application/json'},
    body: JSON.stringify({p_evento: conf.e, p_chiave: conf.k, p_modifiche: invio})})
  .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
  .then(function(d){
    clearTimeout(tempo); inVolo = false;
    if (!st) return;
    if (d && d.errore === 'scaduto') { finito(); return; }
    if (d && d.errore === 'chiave') { esito = 'chiave'; togliChiave('od_conf');
      schermo('Codice non valido', 'Inquadra di nuovo il QR che ti mostra il professore.'); return; }
    st.coda = st.coda.filter(function(m){ return !inviati[m.mid]; });
    st.famiglie = d.famiglie; st.turni = d.turni; st.titolo = d.titolo; st.scade = d.scade; st.agg = Date.now();
    esito = 'ok'; salva();
    if (!document.getElementById('lista')) struttura();
    disegnaLista();
    if (st.coda.length) presto(); else programma();
  })
  .catch(function(){
    clearTimeout(tempo); inVolo = false;
    if (!st) return;
    esito = 'rete';
    if (!st.famiglie) {
      schermo('Serve la rete per la prima apertura', 'Il telefono non riesce a scaricare l\'elenco. Spostati dove prende (fuori dall\'Aula Magna) e premi Riprova.', 'Riprova');
      timer = setTimeout(sincronizza, 5000); return;
    }
    disegnaStato(); programma();
  });
}

/* --- partenza --- */
window.addEventListener('hashchange', function(){ if (confDaIndirizzo()) location.reload(); });
if (!conf) {
  schermo('Presenze Open Day', 'Per entrare inquadra con la fotocamera il QR che ti mostra il professore.');
} else if (st.scade && Date.now() > Date.parse(st.scade)) {
  finito();
} else {
  if (st.famiglie) { struttura(); disegnaLista(); }
  else schermo('Sto scaricando l\'elenco...', 'Resta dove il telefono prende per qualche secondo.');
  sincronizza();
  window.addEventListener('online', presto);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') presto(); });
  window.addEventListener('pageshow', presto);
}
})();
</script>
